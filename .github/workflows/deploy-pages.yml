# Deploy Frontend to GitHub Pages (static only — no FastAPI / OpenAI)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Do not call configure-pages before Pages is enabled in repo Settings
      # (it returns 404 Not Found). Project Pages base = /<repository>/
      - name: Resolve Vite base path
        id: base
        run: |
          echo "path=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_OUTPUT"
          echo "Using VITE_BASE_PATH=/${GITHUB_REPOSITORY##*/}/"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Match local demo: UH-60 exterior GLB + maintenance overlay (not proxy airframe)
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_USE_PROXY_MODEL: "false"
          VITE_GLTF_MODEL_PATH: "models/sikorsky_uh-60m_blackhawk.glb"
        run: npm run build
        # Vite plugin copies ../presentation → dist/presentation (own CSS/JS/assets)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
